name: plumbline gate

# Stands up a real DataHub inside the runner, loads the public showcase
# catalog, and checks the models/ directory against it. Nothing is mocked and
# nothing is exposed to the internet: the catalog lives and dies with the job,
# so anyone can reproduce this by opening a pull request against a fork.
on:
  pull_request:
    paths:
      - "models/**"
      - "src/**"
      - ".github/workflows/plumbline-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        # DataHub's images are several GB and the default runner does not have
        # room alongside the preinstalled toolchains.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "acryl-datahub[datahub-rest]"

      - name: Start DataHub
        run: |
          datahub docker quickstart --version stable --accept-version-default
        env:
          DATAHUB_TELEMETRY_ENABLED: "false"

      - name: Wait for GMS
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/config > /dev/null; then
              echo "GMS is up"; exit 0
            fi
            sleep 10
          done
          echo "GMS did not come up"; exit 1

      - name: Load the public showcase catalog
        run: datahub datapack load showcase-ecommerce
        env:
          DATAHUB_GMS_URL: http://localhost:8080

      - name: Wait for indexing
        env:
          DATAHUB_GMS_URL: http://localhost:8080
        run: |
          python - <<'PY'
          import time
          from datahub.ingestion.graph.client import DatahubClientConfig, DataHubGraph
          g = DataHubGraph(DatahubClientConfig(server="http://localhost:8080"))
          q = """query c { searchAcrossEntities(input:
                {types:[DATASET], query:"*", start:0, count:1}) { total } }"""
          last, stable = -1, 0
          for _ in range(60):
              try:
                  n = g.execute_graphql(q)["searchAcrossEntities"]["total"]
              except Exception:
                  n = -1
              print("datasets indexed:", n, flush=True)
              if n > 40 and n == last:
                  stable += 1
                  if stable >= 2:
                      break
              else:
                  stable = 0
              last = n
              time.sleep(10)
          PY

      - name: Seed the conditions the datapack lacks
        env:
          DATAHUB_GMS_URL: http://localhost:8080
        run: python demo/seed_demo_catalog.py --server http://localhost:8080

      - name: Check models against the catalog
        id: check
        env:
          DATAHUB_GMS_URL: http://localhost:8080
        run: |
          set +e
          plumbline check models/ \
            --platform snowflake --platform-instance b2fd91 \
            --format markdown --out report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if the catalog contradicts the change
        run: |
          if [ "${{ steps.check.outputs.status }}" != "0" ]; then
            echo "Plumbline found references the catalog disproves."
            exit 1
          fi
          echo "Every reference resolves."
